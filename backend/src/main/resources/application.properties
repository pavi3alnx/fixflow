spring.application.name=backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/fixflow
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Existing databases require an explicit, reviewed baseline before migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.jpa.open-in-view=false

# Independent, Base64-encoded random keys of at least 32 bytes; no production defaults.
fixflow.auth.jwt-secret=${JWT_SIGNING_SECRET}
fixflow.auth.otp-secret=${OTP_HASHING_SECRET}
fixflow.auth.university-domains=${UNIVERSITY_EMAIL_DOMAINS:}
fixflow.auth.cors-origins=${CORS_ALLOWED_ORIGINS:}
fixflow.auth.issuer=${JWT_ISSUER:fixflow}
fixflow.auth.audience=${JWT_AUDIENCE:fixflow-api}
fixflow.auth.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
fixflow.auth.otp-ttl=${OTP_TTL:10m}
fixflow.auth.resend-cooldown=${OTP_RESEND_COOLDOWN:60s}
fixflow.auth.max-otp-attempts=${OTP_MAX_ATTEMPTS:5}
fixflow.auth.mail-from=${MAIL_FROM}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Avoid framework payload/credential debug logging. Auth DTOs also redact their string representations.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=INFO
